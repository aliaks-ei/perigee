name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The planet and Andromeda trees are not in the repository. Both
      # `planet-assets` and `galaxy-assets` assert that every shipped file
      # exists, so the tests need the real bytes, not a stub. The paths are
      # version-hashed, so the cache key only moves when the assets do.
      - name: Restore asset bundles
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tmp/asset-bundles
          key: asset-bundles-${{ hashFiles('scripts/asset-bundles.json') }}

      - name: Restore observational assets
        run: npm run assets

      - name: Verify application
        run: npm run verify
