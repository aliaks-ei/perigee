name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The planet and Andromeda trees are not in the repository. Both
      # `planet-assets` and `galaxy-assets` assert that every shipped file
      # exists, so the tests need the real bytes, not a stub. The paths are
      # version-hashed, so the cache key only moves when the assets do.
      - name: Restore asset bundles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/asset-bundles
          key: asset-bundles-${{ hashFiles('scripts/asset-bundles.json') }}

      - name: Restore observational assets
        run: npm run assets

      - name: Verify application
        run: npm run verify
