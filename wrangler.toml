# Cloudflare Workers Static Assets. `npm run generate` produces a static
# bundle, so there is no `main` entry point: the Worker serves the directory
# below directly, and `public/_headers` still applies to those responses.
name = "perigee"
compatibility_date = "2026-09-01"

[assets]
directory = ".output/public"
# Serves the prerendered `404.html` with a real 404 status, so a mistyped
# encounter slug gets the app's own error page. The "single-page-application"
# setting would answer it with 200 and an empty shell instead — a soft 404
# that would undermine the curated routes built for search.
not_found_handling = "404-page"
